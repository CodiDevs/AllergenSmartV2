# =====================================================================
# AllergenSmart API — desarrollo local con Docker.
#   docker compose up --build
# Los secretos se leen de backend/.env (NO se hornean en la imagen).
# =====================================================================
services:
  api:
    build: .
    container_name: allergensmart-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - ENVIRONMENT=development
    restart: unless-stopped

# NOTA: la BD es Supabase (en la nube), no se levanta aquí.
# Para tests e2e con escritura sin tocar Supabase, se podría añadir un
# servicio `db` (postgres:15) y apuntar DATABASE_URL a él (ver Bloque C/D del plan).
